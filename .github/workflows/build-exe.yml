# Builds the Windows .exe in the cloud: GitHub > Actions > "Build Windows exe" > Run workflow.
# When it finishes, download AI_Dungeon_Explorer-windows from the run's Artifacts section.
name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "pygame>=2.5.2" pyinstaller
      - name: Run unit tests
        run: python -m unittest discover tests
      - name: Build exe
        run: pyinstaller --noconfirm --clean --onefile --noconsole --name AI_Dungeon_Explorer --icon assets/icon.ico main.py
      - uses: actions/upload-artifact@v4
        with:
          name: AI_Dungeon_Explorer-windows
          path: dist/AI_Dungeon_Explorer.exe
